<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>万能智能手机 · 下载中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1a, #030609);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        /* 主容器，让内容垂直排列并居中 */
        .main-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.2rem;
            padding: 2rem 1.5rem;
        }

        /* 顶部公告条 — 跳转链接区域 */
        .announcement-banner {
            width: 100%;
            background: rgba(20, 25, 40, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.9rem 1.8rem;
            margin-top: 2rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .announcement-text {
            font-size: 1rem;
            font-weight: 500;
            color: #f0f3fa;
            letter-spacing: 0.3px;
            line-height: 1.45;
            display: inline-block;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .announcement-text a {
            color: #ffd966;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid rgba(255, 217, 102, 0.5);
            transition: all 0.2s;
            margin-left: 8px;
            display: inline-block;
        }

        .announcement-text a:hover {
            color: #ffcd38;
            border-bottom-color: #ffcd38;
            transform: scale(1.02);
            text-shadow: 0 0 6px rgba(255, 217, 102, 0.5);
        }

        /* 主标题 毛玻璃加重 */
        .glow-title {
            font-size: 3.3rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #FFFFFF 0%, #cdd9ff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
            margin-bottom: 0.25rem;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
        }

        /* 双按钮区域 (水平居中) */
        .buttons-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 2.2rem;
            width: 100%;
            margin: 0.5rem 0;
        }

        /* 毛玻璃卡片按钮样式 — 大尺寸 居中块 */
        .glass-card {
            display: flex;
            flex-direction: column;
            flex: 0 1 320px;

            min-width: 280px;
            width: 320px;
            background: rgba(20, 28, 40, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 42px;
            padding: 1.6rem 1rem 1.8rem 1rem;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 32px -12px rgba(0, 0, 0, 0.4), inset 0 0.5px 0 rgba(255,255,255,0.1);
            cursor: pointer;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            background: rgba(30, 38, 55, 0.7);
            border-color: rgba(255, 215, 120, 0.5);
            box-shadow: 0 28px 36px -12px rgba(0, 0, 0, 0.5);
        }

        /* 按钮内图片样式 — 固定合理尺寸且居中 */
        .card-icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            transition: transform 0.2s;
        }

        .glass-card:hover .card-icon img {
            transform: scale(1.02);
        }

        .card-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0.6rem 0 0.3rem;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px black;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #9b9b9b;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            margin-top: 6px;
        }

        .card-fn {
            color: #b9c7d9;
        }

        .card-desc:last-of-type {
            margin-top: auto; /* 将最后一段描述推到底部 */
        }

        /* 海报区域 - 1:1 正方形 */
        .poster-section {
            width: 100%;
            max-width: 400px;
            margin: 0.5rem auto;
        }

        .poster-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 32px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 圆形链接按钮区域 */
        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin: 0.5rem 0 1rem;
            flex-wrap: wrap;
        }

        .circle-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .circle-link:hover {
            transform: translateY(-4px);
        }

        .circle-icon {
            width: 70px;
            height: 70px;
            background: rgba(20, 28, 40, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .circle-link:hover .circle-icon {
            background: rgba(255, 180, 70, 0.3);
            border-color: rgba(255, 200, 100, 0.7);
            box-shadow: 0 0 18px rgba(255, 180, 70, 0.3);
        }

        .circle-icon svg {
            width: 40px;
            height: 40px;
            transition: transform 0.2s;
        }

        .circle-link:hover .circle-icon svg {
            transform: scale(1.05);
        }

        .circle-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #cdd9ff;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            letter-spacing: 0.5px;
        }

        /* 更新公告区域 — 毛玻璃效果 */
        .update-section {
            width: 100%;
            max-width: 880px;
            background: rgba(12, 18, 28, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 1.6rem 2rem 2rem 2rem;
            margin-top: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 18px 28px -8px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
        }

        .update-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.2rem;
            border-left: 4px solid #ffb347;
            padding-left: 18px;
        }

        .update-header h2 {
            font-size: 1.7rem;
            font-weight: 600;
            background: linear-gradient(120deg, #e9f0ff, #cbd9ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .update-badge {
            background: rgba(255, 180, 70, 0.2);
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #ffcf8a;
            border: 0.5px solid rgba(255, 180, 70, 0.5);
        }

        .error {
            color: red;
            background: rgba(255, 0, 0, 0.2);
            border: 0.5px solid rgba(255, 0, 0, 0.5);
            text-shadow: none;
        }

        .update-content {
            color: #cbd5e6;
            font-size: 1rem;
            line-height: 1.55;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 28px;
            padding: 1.2rem 1.5rem;
            min-height: 180px;
            word-break: break-word;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* 留空提示占位符 (表示待更新) */
        .empty-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #8a99b0;
        }

        .empty-placeholder svg {
            opacity: 0.5;
        }

        .empty-placeholder p {
            font-size: 1rem;
            font-weight: 400;
        }

        /* 响应式 */
        @media (max-width: 760px) {
            .buttons-area {
                gap: 1.5rem;
            }
            .glass-card {
                width: 280px;
                padding: 1.2rem 0.8rem 1.4rem;
            }
            .card-icon {
                width: 76px;
                height: 76px;
            }
            .card-title {
                font-size: 1.4rem;
            }
            .glow-title {
                font-size: 2.4rem;
            }
            .announcement-text {
                font-size: 0.85rem;
            }
            .update-content {
                padding: 0;
            }
            .update-section {
                padding: 1rem 1.2rem;
                border-radius: 10px;
            }
            .circle-icon {
                width: 55px;
                height: 55px;
            }
            .circle-icon svg {
                width: 30px;
                height: 30px;
            }
            .circle-label {
                font-size: 0.7rem;
            }
            .poster-section {
                max-width: 280px;
            }
        }

        .glass-card:active {
            transform: scale(0.98);
            transition: 0.05s;
        }

        a {
            text-decoration: none;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #5a6b7c;
            margin-top: 1rem;
        }
    </style>
</head>

            <div class="empty-placeholder">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 8V12L15 15M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#9aaec5" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <p>✨ 暂无新公告，敬请期待后续动态 ✨</p>
                <p style="font-size:0.8rem; opacity:0.7;">开发团队将在这里发布最新版本日志、功能预览与活动情报</p>
            </div>
            <div id="update-content-inner" style="text-align: start; display: none;"></div>
        </div>
    </div>
    <footer>
        开发者: ANLIN.STUDIO
    </footer>
</div>

<script>
    (async function() {
        // 定义准确的下载链接
        const MOD_API_KEY = "DoL-SmartPhone-Self";
        const PHOTO_API_KEY = "DoL-SmartPhone-PhotoPack";
        const API_URL = "https://sb.alseece.top/2/value.php";

        // 从URL中提取文件名
        function getFileNameFromUrl(url) {
            try {
                const urlWithoutQuery = url.split('?')[0];
                const parts = urlWithoutQuery.split('/');
                return decodeURIComponent(parts.pop()) || '未知文件';
            } catch (e) {
                return '下载文件';
            }
        }

        async function fetchDownloadUrl(key, nocount = true) {
            try {
                const response = await fetch(`${API_URL}?key=${encodeURIComponent(key)}&nocount=${nocount ? 1 : 0}`, {
                    mode: 'cors',
                    credentials: 'omit'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                return data.value;
            } catch (error) {
                console.error(`获取 ${key} 失败:`, error);
                return null;
            }
        }

        // 获取模组下载链接
        const MOD_URL = await fetchDownloadUrl(MOD_API_KEY);
        // 获取摄像图包下载链接
        const PHOTO_URL = await fetchDownloadUrl(PHOTO_API_KEY);
 
        // 动态设置描述文本
        const modDesc = document.getElementById('modDesc');
        const photoDesc = document.getElementById('photoDesc');
        if (modDesc && MOD_URL) {
            modDesc.textContent = getFileNameFromUrl(MOD_URL);
        } else if (modDesc) {
            modDesc.textContent = '无法连接到服务器';
        }
        if (photoDesc && PHOTO_URL) {
            photoDesc.textContent = getFileNameFromUrl(PHOTO_URL);
        } else if (photoDesc) {
            photoDesc.textContent = '无法连接到服务器';
        }

        // 异步获取最新版本和公告内容
        (async function() {
            const element = document.querySelector('#update-content-inner');
            const placeholder = document.querySelector('.empty-placeholder');
            if (!element) return;
            try {
                const response = await fetch('https://sb.alseece.top/2/value.php?key=DoL-SmartPhone-Notice&nocount=1', {
                    mode: 'cors',
                    credentials: 'omit'
                });
                const data = await response.json();
                if (data && !data.error && data.value) {
                    let content = data.value;
                    content = content.replaceAll('\n', '<br>');
                    element.innerHTML = content;
                    element.style.display = 'block';
                    if (placeholder) placeholder.style.display = 'none';
                }
            } catch (error) {
                console.log('公告加载失败，使用默认占位');
                if (placeholder) placeholder.style.display = 'flex';
                element.style.display = 'none';
            }

            const element_version = document.querySelector('#version');
            if (!element_version) return;
            try {
                const response = await fetch('https://sb.alseece.top/2/value.php?key=DoL-SmartPhone-LastestVersion&nocount=1', {
                    mode: 'cors',
                    credentials: 'omit'
                });
                const data = await response.json();
                if (data && !data.error && data.value) {
                    let content = data.value;
                    content = content.replaceAll('\n', '<br>');
                    element_version.innerHTML = content;
                }
            } catch (error) {
                element_version.style.display = 'none';
            }
        })();

        // 获取按钮元素
        const modBtn = document.getElementById('modBtn');
        const photoBtn = document.getElementById('photoBtn');

        // 下载函数
        function triggerDownload(key) {
            if (!key) return;
            (async function() {
                const url = await fetchDownloadUrl(key, false);
                if (!url) {
                    alert('下载链接获取失败，请稍后再试');
                    return;
                }
                const link = document.createElement('a');
                link.href = url;
                const urlParts = url.split('/');
                let suggestedName = urlParts.pop() || 'download.zip';
                if (suggestedName.indexOf('?') !== -1) suggestedName = suggestedName.split('?')[0];
                link.download = suggestedName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            })();
        }

        // 绑定下载事件
        modBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerDownload(MOD_API_KEY);
        });

        photoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerDownload(PHOTO_API_KEY);
        });

        // 键盘可访问性
        modBtn.setAttribute('role', 'button');
        modBtn.setAttribute('tabindex', '0');
        photoBtn.setAttribute('role', 'button');
        photoBtn.setAttribute('tabindex', '0');

        modBtn.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                triggerDownload(MOD_API_KEY);
            }
        });
        photoBtn.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                triggerDownload(PHOTO_API_KEY);
            }
        });
    })();
</script>
</body>
</html>
