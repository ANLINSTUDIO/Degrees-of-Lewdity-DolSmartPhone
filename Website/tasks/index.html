<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DoL · 摄像任务编辑器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <div class="card">
            <div class="card-header"><h2>任务元数据</h2></div>
            <div><label>发布文案</label><textarea id="taskMsg" rows="2"></textarea></div>
            <div class="mt-3"><label>任务简述</label><input id="taskDesc"></div>
            <div class="mt-3"><label>风险 (1-100)</label>
                <div class="slider-group">
                    <input type="range" id="riskSlider" min="1" max="100" value="50">
                    <input type="number" id="riskInput" class="risk-value" min="1" max="100" value="50">
                </div>
            </div>
            <div class="flex-row mt-3 horizontal-check">
                <label><input type="checkbox" id="hideCheck"> 未完成时隐藏（特殊任务）</label>
                <label><input type="checkbox" id="uncommonCheck"> 不出现普通评论（通常是没有使自己入镜）</label>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h2>相关名声</h2></div>
            <div class="fame-section">
                <h3>正面名声</h3>
                <div class="fame-grid" id="famePositive"></div>
            </div>
            <div class="fame-section">
                <h3>负面名声</h3>
                <div class="fame-grid" id="fameNegative"></div>
            </div>
            <input type="hidden" id="famesHidden">
        </div>

        <div class="card">
            <div class="card-header"><h2>完成条件</h2></div>
            <div id="conditionsList" class="kv-list"></div>
            <button class="add-btn mt-2" id="addConditionBtn">+ 添加条件</button>
            <div class="flex-row mt-2" style="gap:6px;">
                <button class="quick-key-btn" data-key="$" data-value="() => { return |*| }" data-action="cursor">$</button>
                <button class="quick-key-btn" data-key="passage" data-action="focus">passage</button>
                <button class="quick-key-btn" data-key="$v" data-action="select" data-select="v">$v</button>
                <button class="quick-key-btn" data-key="_v" data-action="select" data-select="v">_v</button>
                <button class="quick-key-btn" data-key="v非" data-action="select" data-select="v">v非</button>
                <span class="quick-separator"></span>
                <button class="quick-key-btn" data-key="$havingOrgasm" data-value="true">正在高潮</button>
                <button class="quick-key-btn" data-key="exposed" data-value="1">一级上体暴露</button>
                <button class="quick-key-btn" data-key="exposed" data-value="2">二级下体暴露</button>
                <button class="quick-key-btn" data-key="combat" data-value="1">正在遭遇战</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h2>评论区</h2></div>
            <div class="comment-section" id="commentSection">
                <div id="commentList"></div>
            </div>
            <div class="input-area">
                <div class="reply-indicator" id="replyIndicator" style="display:none;">
                    ↩️ 回复 <strong id="replyTargetName"></strong>
                    <button class="cancel-reply-btn" id="cancelReplyBtn">✕</button>
                </div>
                <textarea id="commentInput" rows="2" placeholder="输入评论文本…"></textarea>
                <div class="flex-row" style="justify-content:space-between; margin-top:8px;">
                    <div class="effect-bar" id="effectBar"></div>
                    <div class="flex-row">
                        <button class="btn-outline" id="cancelReplyBtn2" style="display:none;">取消回复</button>
                        <button class="btn-primary" id="publishBtn">📝 发布</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h2>任务图像</h2></div>
            <!-- 图像上传区域 -->
            <div class="image-upload-section">
                <div class="image-upload-area" id="imageUploadArea">
                    <div class="image-upload-placeholder" id="imagePlaceholder">
                        <span class="upload-icon">🖼️</span>
                        <span class="upload-text">点击上传任务图片</span>
                    </div>
                    <img id="imagePreview" class="image-preview" style="display:none;" alt="任务图片预览">
                    <button class="btn-outline image-remove-btn" id="imageRemoveBtn" style="display:none;">✕ 移除图片</button>
                    <input type="file" id="imageInput" accept="image/*" style="display:none;">
                </div>
            </div>
        </div>

        <div class="card export-area">
            <div class="flex-row">
                <button class="btn-primary" id="exportBtn">📋 生成对象</button>
                <button class="btn-outline" id="downloadBtn">⬇️ 下载</button>
                <button class="btn-outline" id="copyBtn">复制</button>
                <button class="btn-outline" id="importBtn">📥 导入</button>
            </div>
            <pre id="outputPreview" class="mt-3">// 点击"生成对象"预览</pre>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div id="editModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h3 id="editModalTitle">✏️ 编辑评论</h3>
            <div><label>文本</label><textarea id="editText" rows="2"></textarea></div>
            <div class="mt-2"><label>影响标签</label><div id="editEffectPanel"></div></div>
            <div class="mt-2" id="editCondBlock">
                <label>条件 ( 条件表达式 如 "V.fame.social&gt;400" 或 "C.npc.Avery.love&lt;50" )</label>
                <input id="editCond">
                <div class="flex-row mt-2 horizontal-check">
                    <label><input type="checkbox" id="editAutoFunc" checked> 自动转为函数</label>
                    <label><input type="checkbox" id="editEnableElse"> 启用否条件评论</label>
                </div>
            </div>
            <div id="editCondReadonly" style="display:none;" class="mt-2">
                <label>条件说明</label>
                <div style="padding:0.6rem;background:var(--bg-lighter);border-radius:8px;font-size:0.8rem;color:var(--text-secondary);" id="readonlyCondText"></div>
            </div>
            <div class="flex-row mt-3" style="justify-content:space-between;">
                <button class="btn-outline" id="editDeleteBtn">🗑️ 删除</button>
                <div class="flex-row">
                    <button class="btn-outline" id="editCancelBtn">取消</button>
                    <button class="btn-primary" id="editConfirmBtn">确认</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 自定义确认框 -->
    <div id="confirmModal" class="modal-overlay" style="display:none;">
        <div class="modal-card" style="max-width:360px; text-align:center;">
            <p id="confirmMessage" style="margin-bottom:1.5rem; font-size:1rem;"></p>
            <div class="flex-row" style="justify-content:center; gap:12px;">
                <button class="btn-outline" id="confirmCancel">取消</button>
                <button class="btn-primary" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <!-- 导入模态框 -->
    <div id="importModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h3>📥 导入对象数据</h3>
            <textarea id="importJson" rows="15" placeholder="粘贴 JSON 数据..."></textarea>
            <div class="flex-row mt-3" style="justify-content:flex-end; gap:12px;">
                <button class="btn-outline" id="importCancel">取消</button>
                <button class="btn-primary" id="importConfirm">反推填充</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
